[project]
name = "rag"
version = "0.1.0"
description = "Local RAG over arXiv papers: structure-aware chunking, hybrid BM25 + dense search, reranking, local LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf4llm==1.28.2", # pins pymupdf + pymupdf-layout (AGPL)
    "pydantic-settings>=2.16,<3",
    "tqdm>=4.67",
    "langchain-text-splitters>=1.1.3",
    "tokenizers>=0.23.3",
    "huggingface-hub>=2.2.0",
    "torch>=2.14.1",
    "sentence-transformers>=5.7.0",
    "qdrant-client>=1.19.1",
    "ollama>=0.6.3",
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-ingest = "rag.cli:main"
rag = "rag.cli:main" # same CLI, shorter name: `uv run rag ask "..."`

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

# PyPI's torch wheels for Windows are CPU-only. The RTX 5060 (Blackwell) needs a CUDA 13 build,
# so torch alone comes from PyTorch's own index; `explicit` keeps every other package on PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
